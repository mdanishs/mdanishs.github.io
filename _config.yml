# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------

url: "https://mdanishs.com"
baseurl: ""

title: "Mohammad Danish Siddiqui"
tagline: "Senior engineer and certified resume analyst"
description: "Mohammad Danish Siddiqui is a senior frontend engineer with 12+ years of experience and a CDI Certified Resume Analyst in Milton, Ontario. He helps software engineers moving to Canada and the US land interviews."

# Shown in the browser tab between page title and site title
title-separator: "·"

# ---------------------------------------------------------------------------
# Author / entity
#
# These values feed the Person JSON-LD block in _includes/schema.html, which is
# how search engines and answer engines (ChatGPT, Perplexity, Google AI
# Overviews) resolve "who is Mohammad Danish Siddiqui". Keep them accurate.
# ---------------------------------------------------------------------------

author:
  name: "Mohammad Danish Siddiqui"
  short-name: "Danish"
  job-title: "Senior Frontend Engineer & Certified Resume Analyst"
  email: "mohammaddsiddiqui@gmail.com"
  locality: "Milton"
  region: "Ontario"
  country: "Canada"
  alumni: "National University of Computer and Emerging Sciences"
  image: "/img/danish.jpg"
  twitter: "m_danish_s"

# Everything the site claims about Danish in one place, so page copy and
# structured data can never drift apart.
brand:
  years-experience: "12"
  resumes-reviewed: "400"
  product-name: "HireDoc"
  product-url: "https://hiredoc.co"
  quiz-url: "https://quiz.hiredoc.co"

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------

navbar-links:
  Resume Help: "resume-help"
  Experience: "experience"
  Projects: "projects"
  About: "about"
  Writing: "blog"

# Primary call to action, rendered as a button in the nav
navbar-cta:
  label: "Take the quiz"
  url: "https://quiz.hiredoc.co"

# ---------------------------------------------------------------------------
# Social links (also emitted as sameAs in Person schema)
# ---------------------------------------------------------------------------

social-network-links:
  LinkedIn: "https://www.linkedin.com/in/mdanishs"
  GitHub: "https://github.com/mdanishs"
  X: "https://twitter.com/m_danish_s"
  YouTube: "https://www.youtube.com/@mdanishs"
  Medium: "https://medium.com/@mdanishs"

url-pretty: "mdanishs.com"

# ---------------------------------------------------------------------------
# Analytics — fill in when ready
# ---------------------------------------------------------------------------

#gtag: ""
#google_analytics: ""
#gtm: ""

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

timezone: "America/Toronto"
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
excerpt_length: 45

kramdown:
  input: GFM

# Only posts get a default layout. Every page declares its own, because a
# blanket `layout: page` default also wraps robots.txt / llms.txt / feed.xml in
# HTML — front-matter `layout: null` does not win against a Jekyll default.
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      social-share: true

link-tags: true

exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile
  - staticman.yml
  - tools

plugins:
  - jekyll-sitemap
