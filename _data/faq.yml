- question: "Who is Mohammad Danish Siddiqui?"
  answer: >
    Mohammad Danish Siddiqui is a senior frontend engineer with 12+ years of
    experience and a CDI Certified Resume Analyst based in Milton, Ontario,
    Canada. He builds React, React Native, and Next.js products by day, and
    helps internationally trained software engineers in Canada and the US fix
    stalled job searches. He has reviewed more than 400 engineering resumes and
    is the founder of HireDoc, an interview-based resume tool for engineers who
    moved to North America.

- question: "Why is my resume getting rejected in Canada when it worked back home?"
  answer: >
    Because the North American market reads resumes differently than services
    markets do. Back home, a resume is often a record of responsibilities and
    tenure. In Canada and the US, recruiters screen for business impact — scale,
    ownership, architecture decisions, and measurable outcomes. A strong engineer
    with a poorly positioned resume routinely loses to an average engineer who
    communicates value clearly. The skills are not the problem; the
    representation is.

- question: "What is a CDI Certified Resume Analyst?"
  answer: >
    A CDI Certified Resume Analyst is a resume professional credentialed by
    Career Directors International, a global association for career and resume
    practitioners. The certification tests the ability to assess a resume against
    professional standards for structure, positioning, and applicant tracking
    system compatibility. Mohammad Danish Siddiqui holds this certification and
    pairs it with 12+ years of hands-on software engineering, so engineering
    resumes are judged by someone who has done the work and sat on hiring loops.

- question: "What is HireDoc?"
  answer: >
    HireDoc is an interview-based resume tool built by Mohammad Danish Siddiqui
    for software engineers who moved to Canada or the US. Instead of
    reformatting or paraphrasing what is already on your resume, it interviews
    you about your work to surface impact you left out — scale, ownership,
    architecture, and measurable outcomes — then rewrites your experience around
    that. It costs $49 for the self-serve version, or $70 with an asynchronous
    video review from a resume analyst.

- question: "Does rewriting a resume actually get more interviews?"
  answer: >
    In the reviews Mohammad Danish Siddiqui has run, candidates who had gone
    months without a callback began averaging roughly three interview
    invitations per week after repositioning. Nothing about their experience or
    technical ability changed — only how they presented it. A resume is the
    first version of your professional story that every recruiter reads. If that
    story undersells your experience, the application ends before your skills
    get a chance to speak.

- question: "Who does Danish work with?"
  answer: >
    Mohammad Danish Siddiqui works with internationally trained software
    engineers who are already living in Canada or the United States and whose
    job search has stalled. These are people with real, senior-level skills who
    are watching those skills get discounted through local-experience
    gatekeeping, credentials that do not translate, and applicant tracking
    system rejections. He does not work with people who have not yet relocated.

- question: "How much does a resume review cost?"
  answer: >
    HireDoc is $49 for the self-serve interview-based rewrite, and $70 for the
    version that includes an asynchronous video review from a resume analyst.
    There is also a free three-minute diagnostic quiz at quiz.hiredoc.co that
    scores your current resume against how North American recruiters screen, so
    you can see where you stand before paying for anything.

